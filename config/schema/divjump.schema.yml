divjump.settings:
  type: config_object
  label: 'DivJump settings'
  mapping:
    divs:
      type: sequence
      label: 'Div entries to move'
      sequence:
        type: mapping
        label: 'Div entry'
        mapping:
          div_id:
            type: string
            label: 'Div ID'
          row_position:
            type: integer
            label: 'Insert after views-row number'
          views_selector:
            type: string
            label: 'Views container CSS selector'
    page_visibility:
      type: mapping
      label: 'Page visibility'
      mapping:
        type:
          type: integer
          label: 'Visibility type (0=except listed, 1=only listed)'
        pages:
          type: string
          label: 'Page paths'
